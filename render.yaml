# Render Blueprint — everything the API needs, in one file.
#
# What this creates, wired together:
#
#   * `middlemost-api`    the API. It also runs the scheduled jobs: finding
#                         questions, syncing prices, settling forecasts and
#                         rolling up the leaderboard.
#   * `middlemost-db`     a Postgres database.
#   * `middlemost-cache`  a Key Value (Redis-compatible) cache, used for rate
#                         limits and for the price cache.
#
# Nothing has to be pasted in. Render fills in the database and cache
# addresses, and generates the two secrets.
#
# What this does NOT create: the website. apps/web is a Next.js app deployed
# separately (Vercel, root directory apps/web). It is the only thing that
# calls this API; a browser never does.
#
# ---------------------------------------------------------------------------
# THIS STARTS ON RENDER'S FREE PLANS. READ THIS PART.
# ---------------------------------------------------------------------------
# All three pieces are on free plans, so creating this costs nothing. Free is
# a way to see it running, not a way to run it. Two things come with it:
#
#   THE SERVER SLEEPS. After fifteen minutes with no visitor, Render stops a
#   free server, and starts it again for the next one, which takes about a
#   minute. Until it is up the site's game answers "not answering right now";
#   the pages people read (the mission, the guides) are served by the website
#   and are not affected. Nothing is lost while it sleeps: when it wakes it
#   brings prices, settlements and the standings up to date before anything
#   else (CATCH_UP_ON_STARTUP).
#
#   THE DATABASE IS DELETED. Render switches a free database off thirty days
#   after it is created, and deletes it, with every account in it, fourteen
#   days after that, unless it has been moved to a paid plan by then. Render
#   emails first. Changing the plan keeps the data.
#
# TO STOP EITHER, change the plan lines below and push:
#
#   database  `plan: free` -> `plan: 0.1c-256mb`, and uncomment the two
#             storage lines under it.                 $6 a month + $1.50 storage
#   server    `plan: free` -> `plan: 0.5c-512mb`, and delete the two
#             "sized for the free server" variables.              $7 a month
#
# (Render's prices in November 2026. The cache can stay free.)
#
# Render allows one free database and one free Key Value per workspace. If
# yours already has either, creating this is refused; the plan lines above
# are the fix for that as well.
#
# ---------------------------------------------------------------------------
# FIRST DEPLOY
# ---------------------------------------------------------------------------
#   1. Render → New → Blueprint → this repository → Apply. Render shows what
#      it will create, and what it costs, before anything is created.
#   2. When `middlemost-api` is live, give the website two values
#      (Vercel → project → Settings → Environment Variables):
#        API_BASE_URL      the service's https address, shown at the top of
#                          its page on Render
#        INTERNAL_API_KEY  the value Render generated — on the service's
#                          Environment tab
#      then redeploy the site. Until the site has both, every door into the
#      game says "not open yet".
#   3. Create your own account on the site, copy its player code from the
#      Account tab, and add ADMIN_PLAYER_CODES=<that code> to the service's
#      Environment tab. That is what opens /admin, and only to you.
#
# Migrations apply themselves: the container runs scripts/migrate.py before it
# starts the server (scripts/start.sh). There is no separate pre-deploy step
# because a free server cannot have one.
#
# ---------------------------------------------------------------------------
# ONE PROCESS, TO START WITH
# ---------------------------------------------------------------------------
# The API and the scheduled jobs run in the same process (WORKERS_ENABLED is
# "true" on the one service). That is the cheapest arrangement that is still
# correct, and it is plenty for a new site.
#
# To grow, on paid plans: set WORKERS_ENABLED to "false" here and raise
# numInstances, then add a second service of `type: worker` with the same
# image, the same environment and WORKERS_ENABLED "true". Every job takes a
# lease in the database before it runs, so more than one copy is safe; the
# split only keeps a slow job from sharing a process with visitors.
#
# The database is Render's own, on the private network, rather than a free
# serverless one elsewhere. Render may suspend a free server that sends a lot
# of traffic to outside services, and names an outside database as an example.

previews:
  generation: "off"

databases:
  - name: middlemost-db
    databaseName: middlemost
    region: frankfurt
    # Free: 1 GB, no backups, and gone after thirty days. See the top of this
    # file before the thirty days are up.
    plan: free
    # The version the tests run against: CI and docker-compose.yml both use
    # Postgres 16. Left out, Render picks its newest, and a database's major
    # version can be raised later but never lowered, so it is chosen here.
    postgresMajorVersion: "16"
    # For the paid plan. Storage is billed by the gigabyte, and a disk can be
    # made larger but never smaller, so this starts small rather than at
    # Render's default of 15. The price history the sync job keeps is what
    # grows: by a rough estimate, a few gigabytes a year. A full disk suspends
    # the database, so Render is allowed to add space before that happens: at
    # 90% full it grows the disk by half, rounded up to the next 5 GB.
    # diskSizeGB: 5
    # storageAutoscalingEnabled: true
    # Reachable from the private network only.
    ipAllowList: []

services:
  - type: keyvalue
    name: middlemost-cache
    region: frankfurt
    # 25 MB, kept in memory only, which is all this needs.
    plan: free
    # Reachable from the private network only.
    ipAllowList: []
    # Nothing kept here is the only copy of anything: rate-limit counters
    # expire and prices are re-read from Postgres. So when it is full, the
    # oldest entries may go.
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: middlemost-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    # Free: a tenth of a CPU and 512 MB, asleep when nobody is visiting. See
    # the top of this file.
    plan: free
    numInstances: 1
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - scripts/**
        - db/migrations/**
        - Dockerfile
        - render.yaml
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

      # Signs session tokens. Rotating it signs everybody out.
      - key: JWT_SECRET
        generateValue: true
      # Shared with the website, which must be given the same value. Only a
      # request carrying it may open a session or say which visitor it is
      # acting for; the API refuses to start in production without it.
      - key: INTERNAL_API_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: middlemost-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: middlemost-cache
          property: connectionString

      # One container holds one pool, shared by visitors and by the jobs.
      # A deploy briefly runs two containers, and the migration takes a
      # connection of its own: 2 * 8 + 1, well inside any plan.
      - key: DB_POOL_MIN
        value: "1"
      - key: DB_POOL_MAX
        value: "8"

      # This process serves visitors and runs the scheduled jobs.
      - key: WORKERS_ENABLED
        value: "true"
      # Fetch questions as soon as it starts, rather than at the next tick,
      # so a new deployment is not an empty page for its first hour.
      - key: RUN_DISCOVERY_ON_STARTUP
        value: "true"

      # ----- Sized for the free server ---------------------------------------
      # A tenth of a CPU has to refresh every open question's price once a
      # minute and still answer visitors, so the free server keeps the 150
      # most-traded questions and reads only the top of the list to find
      # them. Delete both lines on a paid plan: the defaults are 400 questions
      # and 20 pages, measured to fit in half a CPU and 512 MB.
      - key: PRICE_SYNC_MAX_MARKETS
        value: "150"
      - key: DISCOVERY_MAX_PAGES
        value: "5"

      # The website's address. CORS_ORIGINS only has to not be the development
      # default — no browser calls this API, the site's own server does — and
      # must never be "*": startup refuses it. SITE_URL is where Stripe sends
      # people back after a checkout, if the shop is ever opened.
      - key: CORS_ORIGINS
        value: https://middlemost.sinadehesh.com
      - key: SITE_URL
        value: https://middlemost.sinadehesh.com

      # ----- Set by hand, later, on the Environment tab ----------------------
      #
      # ADMIN_PLAYER_CODES   your own six-character player code, once your
      #                      account exists. Empty means /admin answers 404 to
      #                      everybody, which is the right state until then.
      #
      # ECONOMY_TIMEZONE     the day boundary for the daily top-up, daily
      #                      limits and leaderboard seasons, as an IANA zone
      #                      name (Europe/London). Unset means UTC.
      #
      # ----- The shop: closed unless you open it -----------------------------
      # Not declared here, so that creating this Blueprint never asks for a
      # payment key and never opens a shop by accident. With none set, nothing
      # is for sale and the site says so. To open it, add these two:
      #
      #   STRIPE_SECRET_KEY      a live key: sk_live_… or a restricted rk_live_…
      #                          with write access to Checkout Sessions only
      #   STRIPE_WEBHOOK_SECRET  the whsec_… of a webhook endpoint pointed at
      #                          https://<this service>/v1/payments/stripe/webhook
      #                          sending checkout.session.completed,
      #                          checkout.session.expired, charge.refunded and
      #                          charge.dispute.created
      #
      # The service refuses to start with a key and no webhook secret, because
      # that would take money and never credit it. Prices, pack sizes and the
      # monthly cap have defaults; see apps/api/.env.example to change them.
      # Do not open it on the free server: a payment that arrives while it is
      # asleep waits for it to wake, and a shop should not keep a buyer waiting.
