# Render Blueprint — everything the API needs, in one file.
#
# What this creates, wired together:
#
#   * `middlemost-api`    the API. It also runs the scheduled jobs: finding
#                         questions, syncing prices, settling forecasts and
#                         rolling up the leaderboard.
#   * `middlemost-db`     a Postgres database.
#   * `middlemost-cache`  a Key Value (Redis-compatible) cache, used for rate
#                         limits and for the price cache.
#
# Nothing has to be pasted in. Render fills in the database and cache
# addresses, and generates the two secrets.
#
# What this does NOT create: the website. apps/web is a Next.js app deployed
# separately (Vercel, root directory apps/web). It is the only thing that
# calls this API; a browser never does.
#
# ---------------------------------------------------------------------------
# FIRST DEPLOY
# ---------------------------------------------------------------------------
#   1. Render → New → Blueprint → this repository → Apply. Render shows what
#      it will create, and what it costs, before anything is created.
#   2. When `middlemost-api` is live, give the website two values
#      (Vercel → project → Settings → Environment Variables):
#        API_BASE_URL      the service's https address, shown at the top of
#                          its page on Render
#        INTERNAL_API_KEY  the value Render generated — on the service's
#                          Environment tab
#      then redeploy the site. Until the site has both, every door into the
#      game says "not open yet".
#   3. Create your own account on the site, copy its player code from the
#      Account tab, and add ADMIN_PLAYER_CODES=<that code> to the service's
#      Environment tab. That is what opens /admin, and only to you.
#
# Migrations apply themselves: preDeployCommand runs scripts/migrate.py before
# traffic moves to each release.
#
# ---------------------------------------------------------------------------
# ONE PROCESS, TO START WITH
# ---------------------------------------------------------------------------
# The API and the scheduled jobs run in the same process (WORKERS_ENABLED is
# "true" on the one service). That is the cheapest arrangement that is still
# correct, and it is plenty for a new site.
#
# To grow: set WORKERS_ENABLED to "false" here and raise numInstances, then
# add a second service of `type: worker` with the same image, the same
# environment and WORKERS_ENABLED "true". Every job takes a lease in the
# database before it runs, so more than one copy is safe; the split only
# keeps a slow job from sharing a process with visitors.
#
# The database is Render's own, on the private network, rather than a free
# serverless one elsewhere. The jobs touch the database every minute, so it
# never goes idle — and a free plan that is metered by hours awake runs out
# part-way through the month.

previews:
  generation: "off"

databases:
  - name: middlemost-db
    databaseName: middlemost
    region: frankfurt
    # The smallest plan that does not expire. The free plan is deleted after
    # thirty days, which is not a property a ledger should have.
    plan: basic-256mb
    # Reachable from the private network only.
    ipAllowList: []

services:
  - type: keyvalue
    name: middlemost-cache
    region: frankfurt
    plan: free
    # Reachable from the private network only.
    ipAllowList: []
    # Nothing kept here is the only copy of anything: rate-limit counters
    # expire and prices are re-read from Postgres. So when it is full, the
    # oldest entries may go.
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: middlemost-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    # Not `free`: a free web service sleeps when idle, which would stop the
    # scheduled jobs, and it cannot run a preDeployCommand, which is how the
    # migrations are applied.
    plan: starter
    numInstances: 1
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - scripts/**
        - db/migrations/**
        - Dockerfile
        - render.yaml
    preDeployCommand: python scripts/migrate.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

      # Signs session tokens. Rotating it signs everybody out.
      - key: JWT_SECRET
        generateValue: true
      # Shared with the website, which must be given the same value. Only a
      # request carrying it may open a session or say which visitor it is
      # acting for; the API refuses to start in production without it.
      - key: INTERNAL_API_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: middlemost-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: middlemost-cache
          property: connectionString

      # One container holds one pool, shared by visitors and by the jobs.
      # A rolling deploy briefly runs two containers, and the migration
      # takes a connection of its own: 2 * 8 + 1, well inside the plan.
      - key: DB_POOL_MIN
        value: "1"
      - key: DB_POOL_MAX
        value: "8"

      # This process serves visitors and runs the scheduled jobs.
      - key: WORKERS_ENABLED
        value: "true"
      # Fetch questions as soon as it starts, rather than at the next tick,
      # so a new deployment is not an empty page for its first hour.
      - key: RUN_DISCOVERY_ON_STARTUP
        value: "true"

      # The website's address. CORS_ORIGINS only has to not be the development
      # default — no browser calls this API, the site's own server does — and
      # must never be "*": startup refuses it. SITE_URL is where Stripe sends
      # people back after a checkout, if the shop is ever opened.
      - key: CORS_ORIGINS
        value: https://middlemost.sinadehesh.com
      - key: SITE_URL
        value: https://middlemost.sinadehesh.com

      # ----- Set by hand, later, on the Environment tab ----------------------
      #
      # ADMIN_PLAYER_CODES   your own six-character player code, once your
      #                      account exists. Empty means /admin answers 404 to
      #                      everybody, which is the right state until then.
      #
      # ECONOMY_TIMEZONE     the day boundary for the daily top-up, daily
      #                      limits and leaderboard seasons, as an IANA zone
      #                      name (Europe/London). Unset means UTC.
      #
      # ----- The shop: closed unless you open it -----------------------------
      # Not declared here, so that creating this Blueprint never asks for a
      # payment key and never opens a shop by accident. With none set, nothing
      # is for sale and the site says so. To open it, add these two:
      #
      #   STRIPE_SECRET_KEY      a live key: sk_live_… or a restricted rk_live_…
      #                          with write access to Checkout Sessions only
      #   STRIPE_WEBHOOK_SECRET  the whsec_… of a webhook endpoint pointed at
      #                          https://<this service>/v1/payments/stripe/webhook
      #                          sending checkout.session.completed,
      #                          checkout.session.expired, charge.refunded and
      #                          charge.dispute.created
      #
      # The service refuses to start with a key and no webhook secret, because
      # that would take money and never credit it. Prices, pack sizes and the
      # monthly cap have defaults; see apps/api/.env.example to change them.
